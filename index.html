<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memomatic</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F7F7F9">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #E9EDF2;
    --ink-2: #FFFFFF;
    --ink-3: #D7DEE8;
    --ink-dark: #0F2D63;
    --paper: #0F2D63;
    --amber: #F28C28;
    --amber-dim: #F28C2855;
    --teal: #1FAE7A;
    --red: #D14D4D;
    --muted: #6B7690;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: linear-gradient(180deg, #F7F7F9 0%, #E9E9ED 100%);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 19px;
    line-height: 1.5;
    min-height: 100vh;
    padding-bottom: 48px;
  }
  header{
    padding: 20px 20px 8px;
    text-align: center;
  }
  .brand-title-img{
    height: 27px;
    width: auto;
  }

  /* --- Mic stage --- */
  .stage{
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 20px 8px;
  }
  .mic-wrap{
    position: relative;
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--amber-dim);
    opacity: 0;
  }
  .listening .ring{
    animation: pulse 1.8s ease-out infinite;
  }
  .listening .ring:nth-child(2){ animation-delay: 0.6s; }
  .listening .ring:nth-child(3){ animation-delay: 1.2s; }
  @keyframes pulse{
    0%{ transform: scale(0.75); opacity: 0.9; }
    100%{ transform: scale(1.35); opacity: 0; }
  }
  #micBtn{
    position: relative;
    width: 176px;
    height: 176px;
    border-radius: 50%;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s;
  }
  #micBtn:active{ transform: scale(0.96); }

  .mic-icon-stack{
    position: relative;
    width: 150px;
    height: 150px;
    display: inline-block;
  }
  .mic-icon{
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .mic-fill{ opacity: 0; }

  .listening .mic-icon-stack{
    animation: pulse-grow 1.1s ease-in-out infinite;
  }
  .listening .mic-fill{
    animation: pulse-fill 1.1s ease-in-out infinite;
  }
  @keyframes pulse-grow{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.12); }
  }
  @keyframes pulse-fill{
    0%, 100%{ opacity: 0; }
    50%{ opacity: 1; }
  }

  .status{
    margin-top: 18px;
    min-height: 24px;
    font-size: 16px;
    color: var(--muted);
    text-align: center;
  }
  .listening .status{ color: var(--amber); font-weight: 600; }

  .waveform{
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 28px;
    margin-top: 10px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .listening .waveform{ opacity: 1; }
  .waveform span{
    width: 4px;
    background: var(--amber);
    border-radius: 2px;
    animation: bar 0.9s ease-in-out infinite;
  }
  .waveform span:nth-child(1){ animation-delay: 0s; }
  .waveform span:nth-child(2){ animation-delay: 0.15s; }
  .waveform span:nth-child(3){ animation-delay: 0.3s; }
  .waveform span:nth-child(4){ animation-delay: 0.45s; }
  .waveform span:nth-child(5){ animation-delay: 0.6s; }
  @keyframes bar{
    0%, 100%{ height: 6px; }
    50%{ height: 26px; }
  }

  /* --- Folders --- */
  .folders-section{
    margin: 28px 20px 0;
  }
  .folders-section h2{
    font-family: "Jost", sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 12px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .folders-row{
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .folder-chip{
    flex: 0 0 auto;
    background: var(--ink-2);
    color: var(--muted);
    border: 1px solid var(--ink-3);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
  }
  .folder-chip.active{
    background: var(--amber);
    color: var(--ink-dark);
    border-color: var(--amber);
  }
  .folder-add{
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--ink-2);
    border: 1px solid var(--ink-3);
    color: var(--amber);
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  /* --- Agenda list --- */
  .agenda{
    margin: 24px 20px 0;
  }
  .note-card{
    background: var(--ink-2);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .note-text{
    flex: 1;
    font-size: 18px;
    word-break: break-word;
  }
  .note-meta{
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 8px;
  }
  .note-time{
    color: var(--amber);
    font-size: 14px;
    font-weight: 600;
  }
  .note-folder{
    color: var(--muted);
    font-size: 13px;
    background: var(--ink-3);
    border-radius: 999px;
    padding: 2px 10px;
  }
  .del-btn{
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 4px;
    font-size: 20px;
    line-height: 1;
  }
  .del-btn:active{ color: var(--red); }

  .empty{
    color: var(--muted);
    text-align: center;
    padding: 30px 20px;
    font-size: 16px;
  }

  /* --- Note edit page (pantalla completa) --- */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: var(--ink);
    display: none;
    flex-direction: column;
    z-index: 50;
  }
  .modal-overlay.show{ display: flex; }

  .note-topbar{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 14px 6px;
    flex: 0 0 auto;
  }
  .icon-btn{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--paper);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
  }
  .icon-btn.danger{ color: var(--muted); }
  .icon-btn.danger:active{ color: var(--red); }

  .modal-sheet{
    background: transparent;
    flex: 1;
    padding: 6px 16px 14px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .note-editable{
    flex: 1;
    background: var(--ink-2);
    border-radius: 14px;
    padding: 18px;
    font-size: 19px;
    outline: none;
    overflow-y: auto;
  }

  .note-bottombar{
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 6px 4px;
    flex-wrap: wrap;
  }
  .tool-btn{
    background: transparent;
    color: var(--muted);
    border: none;
    border-radius: 8px;
    width: 34px;
    height: 34px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .tool-btn.bold-b{ font-weight: 900; color: var(--paper); }
  .color-dot{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--ink-3);
    padding: 0;
  }
  .color-dot[data-color="paper"]{ background: var(--paper); }
  .color-dot[data-color="amber"]{ background: var(--amber); }

  .bottombar-sep{
    width: 1px;
    height: 22px;
    background: var(--ink-3);
    margin: 0 2px;
  }

  .folder-select-row{
    display: flex;
    align-items: center;
    flex: 1;
    min-width: 0;
  }
  .folder-select-row select{
    width: 100%;
    background: transparent;
    color: var(--muted);
    border: none;
    border-radius: 8px;
    padding: 6px 4px;
    font-size: 14px;
    font-family: inherit;
  }

  .unsupported{
    margin: 20px;
    background: var(--red);
    color: var(--ink-dark);
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 15px;
    display: none;
  }
</style>
</head>
<body>

<header>
  <img src="wordmark-clean.png" alt="memomatic" class="brand-title-img">
</header>

<div id="unsupported" class="unsupported">
  Este navegador no admite dictado por voz. Prueba con Chrome en Android.
</div>

<div class="stage" id="stage">
  <div class="mic-wrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <button id="micBtn" aria-label="Grabar nota de voz">
      <span class="mic-icon-stack">
        <img src="brain-fill-orange.png" alt="" class="mic-icon mic-fill">
        <img src="brain-icon-transparent.png" alt="" class="mic-icon mic-outline">
      </span>
    </button>
  </div>
  <div class="status" id="status"></div>
  <div class="waveform">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>


<div class="folders-section">
  <div class="folders-row" id="foldersRow"></div>
</div>

<div class="agenda">
  <div id="notesList"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="note-topbar">
    <button class="icon-btn" id="backBtn" aria-label="Volver">&#8592;</button>
    <button class="icon-btn danger" id="modalDelete" aria-label="Eliminar nota">&#128465;</button>
  </div>
  <div class="modal-sheet">
    <div class="note-editable" id="noteEditable" contenteditable="true"></div>
    <div class="note-bottombar">
      <button class="tool-btn bold-b" id="boldBtn" type="button">N</button>
      <button class="tool-btn color-dot" data-color="paper" data-value="#26272C" type="button" aria-label="Texto negro"></button>
      <button class="tool-btn color-dot" data-color="amber" data-value="#F28C28" type="button" aria-label="Texto naranja"></button>
      <div class="bottombar-sep"></div>
      <div class="folder-select-row">
        <select id="moveFolderSelect"></select>
      </div>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'voicenotes_v1';
  const FOLDERS_KEY = 'voicenotes_folders_v1';
  const stage = document.getElementById('stage');
  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const notesList = document.getElementById('notesList');
  const unsupported = document.getElementById('unsupported');
  const foldersRow = document.getElementById('foldersRow');
  const modalOverlay = document.getElementById('modalOverlay');
  const noteEditable = document.getElementById('noteEditable');
  const boldBtn = document.getElementById('boldBtn');
  const backBtn = document.getElementById('backBtn');
  const modalDelete = document.getElementById('modalDelete');
  const moveFolderSelect = document.getElementById('moveFolderSelect');

  let activeFolderId = 'all';
  let editingNoteId = null;

  let recognition = null;
  let listening = false;
  let accumulated = '';       // texto ya confirmado de sesiones anteriores (antes de una pausa)
  let sessionFinal = '';      // texto confirmado de la sesión actual
  let userStopped = false;    // true cuando el usuario ha pulsado el botón para terminar
  let autoSaveTriggered = false; // true cuando se ha dicho la palabra clave "guardar"
  const KEYWORD_RE = /\bcambio\s*(y)?\s*corto\b\.?\s*$/i;
  const FOLDER_CMD_RE = /\b(?:a la carpeta|carpeta)\s+(.+?)\s*$/i;

  function extractFolderCommand(text){
    const match = text.match(FOLDER_CMD_RE);
    if (!match) return { text: text, folderName: null };
    const folderNameSpoken = match[1].replace(/[.,]+$/, '').trim();
    const cleanText = text.slice(0, match.index).trim();
    return { text: cleanText, folderName: folderNameSpoken };
  }

  function resolveFolderId(spokenName){
    if (!spokenName) return 'default';
    const normalize = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
    const target = normalize(spokenName);
    const folders = loadFolders();
    const existing = folders.find(f => normalize(f.name) === target);
    if (existing) return existing.id;
    // No existe: la creamos con el nombre tal cual se ha dicho (con mayúscula inicial).
    const niceName = spokenName.charAt(0).toUpperCase() + spokenName.slice(1);
    const id = 'f' + Date.now().toString();
    folders.push({ id, name: niceName });
    saveFolders(folders);
    return id;
  }

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  const isSecure = location.protocol === 'https:' || location.hostname === 'localhost';

  if (!SpeechRecognition) {
    unsupported.textContent = 'Este navegador no admite dictado por voz. Prueba con Chrome en Android.';
    unsupported.style.display = 'block';
    micBtn.disabled = true;
  } else if (!isSecure) {
    unsupported.textContent = 'El micrófono solo funciona si esta página se abre por https (por ejemplo, subida a GitHub Pages). Ahora mismo se ha abierto como archivo local y el reconocimiento de voz no podrá activarse.';
    unsupported.style.display = 'block';
  } else {
    recognition = new SpeechRecognition();
    recognition.lang = 'es-ES';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
      // Aquí es cuando el micrófono está realmente activo (coincide con el aviso
      // sonoro del sistema), así que la animación visual arranca justo aquí.
      stage.classList.add('listening');
      statusEl.textContent = 'Escuchando...';
    };

    recognition.onresult = (event) => {
      let final = '';
      let interim = '';
      for (let i = 0; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          final += chunk + ' ';
        } else {
          interim += chunk;
        }
      }
      sessionFinal = final;
      statusEl.textContent = (accumulated + sessionFinal + interim).trim() || 'Escuchando...';

      if (!autoSaveTriggered && KEYWORD_RE.test(sessionFinal.trim())) {
        autoSaveTriggered = true;
        sessionFinal = sessionFinal.replace(KEYWORD_RE, '').trim();
        userStopped = true;
        try { recognition.stop(); } catch(e) {}
      }
    };

    recognition.onerror = (event) => {
      // 'no-speech' y 'aborted' ocurren simplemente por una pausa; se reinicia solo en onend.
      if (event.error === 'no-speech' || event.error === 'aborted') return;
      let msg = 'No se ha entendido, inténtalo de nuevo';
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        msg = 'Permiso de micrófono denegado. Revisa los permisos del sitio en Chrome.';
      } else if (event.error === 'audio-capture') {
        msg = 'No se encuentra ningún micrófono disponible.';
      } else if (event.error === 'network') {
        msg = 'Sin conexión. El dictado por voz necesita internet.';
      }
      statusEl.textContent = msg;
      listening = false;
      stage.classList.remove('listening');
    };

    recognition.onend = () => {
      if (userStopped && autoSaveTriggered) {
        // Guardado por voz: se guarda directamente en 'Por defecto', sin revisión manual.
        listening = false;
        stage.classList.remove('listening');
        const text = (accumulated + sessionFinal).trim();
        accumulated = '';
        sessionFinal = '';
        autoSaveTriggered = false;
        userStopped = false;
        if (text) {
          saveNewNoteAndOpen(text, { parseFolderCommand: true, autoClose: true });
        }
        // No cerramos la app aquí (la cuestión de cerrar se gestiona ahora desde
        // el aviso de inactividad de la pantalla de la nota, ver openEditor).
      } else if (userStopped) {
        // El usuario ha pedido terminar tocando el botón: guardamos y abrimos
        // la nota a pantalla completa, igual que con "cambio y corto" pero sin
        // el cierre automático a los 10 segundos.
        listening = false;
        stage.classList.remove('listening');
        const text = (accumulated + sessionFinal).trim();
        accumulated = '';
        sessionFinal = '';
        statusEl.textContent = '';
        if (text) {
          saveNewNoteAndOpen(text, { parseFolderCommand: false, autoClose: false });
        }
      } else if (listening) {
        // Pausa detectada: guardamos lo confirmado y reiniciamos la escucha sin cerrar nada.
        accumulated += sessionFinal;
        sessionFinal = '';
        try { recognition.start(); } catch(e) {}
      }
    };
  }

  function saveNewNoteAndOpen(text, options){
    const opts = options || {};
    let cleanText = text;
    let folderId = 'default';
    if (opts.parseFolderCommand) {
      const parsed = extractFolderCommand(text);
      cleanText = parsed.text || text;
      folderId = resolveFolderId(parsed.folderName);
    }
    const newId = Date.now().toString();
    const notes = loadNotes();
    notes.unshift({
      id: newId,
      html: escapeHtml(cleanText),
      folderId: folderId,
      createdAt: new Date().toISOString()
    });
    saveNotes(notes);
    renderFolders();
    renderNotes();
    openEditor(newId, { autoCloseAfterVoice: !!opts.autoClose });
  }

  function startListening(){
    accumulated = '';
    sessionFinal = '';
    userStopped = false;
    autoSaveTriggered = false;
    listening = true;
    statusEl.textContent = '';
    try { recognition.start(); } catch(e) {}
  }

  function stopListening(){
    userStopped = true;
    try { recognition.stop(); } catch(e) {}
  }

  micBtn.addEventListener('click', () => {
    if (!SpeechRecognition) return;
    if (listening) {
      stopListening();
    } else {
      startListening();
    }
  });

  function loadNotes(){
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) {
      return [];
    }
  }

  function saveNotes(notes){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }

  function deleteNote(id){
    const ok = window.confirm('¿Eliminar esta nota? No se puede deshacer.');
    if (!ok) return;
    const notes = loadNotes().filter(n => n.id !== id);
    saveNotes(notes);
    renderNotes();
  }

  /* --- Folders --- */
  function loadFolders(){
    try {
      const stored = JSON.parse(localStorage.getItem(FOLDERS_KEY));
      if (stored && stored.length) return stored;
    } catch(e) {}
    return [{ id: 'default', name: 'Por defecto' }];
  }

  function saveFolders(folders){
    localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders));
  }

  let longPressTriggered = false;
  let pressTimer = null;

  function renderFolders(){
    const folders = loadFolders();
    const chips = [{ id: 'all', name: 'Todas las notas' }, ...folders];
    foldersRow.innerHTML = chips.map(f => `
      <button class="folder-chip ${f.id === activeFolderId ? 'active' : ''}" data-folder="${f.id}" data-name="${escapeHtml(f.name)}">${escapeHtml(f.name)}</button>
    `).join('') + '<button class="folder-add" id="addFolderBtn" aria-label="Nueva carpeta">+</button>';

    foldersRow.querySelectorAll('.folder-chip').forEach(chip => {
      const start = () => {
        longPressTriggered = false;
        pressTimer = setTimeout(() => {
          longPressTriggered = true;
          confirmDeleteFolder(chip.getAttribute('data-folder'), chip.getAttribute('data-name'));
        }, 600);
      };
      const cancel = () => clearTimeout(pressTimer);

      chip.addEventListener('touchstart', start);
      chip.addEventListener('touchend', cancel);
      chip.addEventListener('touchmove', cancel);
      chip.addEventListener('mousedown', start);
      chip.addEventListener('mouseup', cancel);
      chip.addEventListener('mouseleave', cancel);

      chip.addEventListener('click', () => {
        if (longPressTriggered) { longPressTriggered = false; return; }
        activeFolderId = chip.getAttribute('data-folder');
        renderFolders();
        renderNotes();
      });
    });
    document.getElementById('addFolderBtn').addEventListener('click', addFolder);
  }

  function confirmDeleteFolder(id, name){
    if (id === 'default' || id === 'all') {
      window.alert(`"${name}" no se puede eliminar.`);
      return;
    }
    const ok = window.confirm(`¿Eliminar la carpeta "${name}"? Sus notas pasarán a "Por defecto".`);
    if (!ok) return;
    const notes = loadNotes().map(n => (n.folderId === id ? { ...n, folderId: 'default' } : n));
    saveNotes(notes);
    const folders = loadFolders().filter(f => f.id !== id);
    saveFolders(folders);
    if (activeFolderId === id) activeFolderId = 'default';
    renderFolders();
    renderNotes();
  }

  function addFolder(){
    const name = window.prompt('Nombre de la nueva carpeta:');
    if (!name || !name.trim()) return;
    const folders = loadFolders();
    const id = 'f' + Date.now().toString();
    folders.push({ id, name: name.trim() });
    saveFolders(folders);
    renderFolders();
  }

  function folderName(id){
    const f = loadFolders().find(x => x.id === id);
    return f ? f.name : 'Por defecto';
  }

  function fillFolderSelect(selectEl, selectedId){
    const folders = loadFolders();
    selectEl.innerHTML = folders.map(f =>
      `<option value="${f.id}" ${f.id === selectedId ? 'selected' : ''}>${escapeHtml(f.name)}</option>`
    ).join('');
  }

  function formatDate(iso){
    const d = new Date(iso);
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    const time = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    if (isToday) return `Hoy, ${time}`;
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }) + `, ${time}`;
  }

  function renderNotes(){
    let notes = loadNotes().slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    if (activeFolderId !== 'all') {
      notes = notes.filter(n => (n.folderId || 'default') === activeFolderId);
    }
    if (notes.length === 0) {
      notesList.innerHTML = '<div class="empty">Todavía no hay notas aquí</div>';
      return;
    }
    notesList.innerHTML = notes.map(n => `
      <div class="note-card" data-note="${n.id}">
        <div class="note-text">
          <div>${n.html || escapeHtml(n.text || '')}</div>
          <div class="note-meta">
            <span class="note-time">${formatDate(n.createdAt)}</span>
            <span class="note-folder">${escapeHtml(folderName(n.folderId))}</span>
          </div>
        </div>
        <button class="del-btn" data-del="${n.id}" aria-label="Borrar nota">✕</button>
      </div>
    `).join('');

    notesList.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteNote(btn.getAttribute('data-del'));
      });
    });
    notesList.querySelectorAll('.note-card').forEach(card => {
      card.addEventListener('click', () => openEditor(card.getAttribute('data-note')));
    });
  }

  /* --- Note edit page --- */
  let inactivityTimer = null;

  function openEditor(id, opts){
    const notes = loadNotes();
    const note = notes.find(n => n.id === id);
    if (!note) return;
    editingNoteId = id;
    noteEditable.innerHTML = note.html;
    fillFolderSelect(moveFolderSelect, note.folderId || 'default');
    modalOverlay.classList.add('show');

    clearTimeout(inactivityTimer);
    if (opts && opts.autoCloseAfterVoice) {
      inactivityTimer = setTimeout(() => {
        saveEditor();
        closeEditor();
        // Intento de cerrar la app entera; si el navegador no lo permite,
        // simplemente se queda cerrada la nota y en reposo.
        try { window.close(); } catch(e) {}
      }, 10000);
      const resetTimer = () => { clearTimeout(inactivityTimer); };
      noteEditable.addEventListener('input', resetTimer, { once: true });
      moveFolderSelect.addEventListener('change', resetTimer, { once: true });
      boldBtn.addEventListener('click', resetTimer, { once: true });
      document.querySelectorAll('.color-dot').forEach(btn => btn.addEventListener('click', resetTimer, { once: true }));
    }
  }

  function saveEditor(){
    if (!editingNoteId) return;
    const notes = loadNotes();
    const note = notes.find(n => n.id === editingNoteId);
    if (note) {
      note.html = noteEditable.innerHTML;
      note.folderId = moveFolderSelect.value || 'default';
      saveNotes(notes);
      renderNotes();
    }
  }

  function closeEditor(){
    clearTimeout(inactivityTimer);
    modalOverlay.classList.remove('show');
    editingNoteId = null;
  }

  backBtn.addEventListener('click', () => {
    saveEditor();
    closeEditor();
  });

  modalDelete.addEventListener('click', () => {
    if (!editingNoteId) return;
    deleteNote(editingNoteId);
    closeEditor();
  });

  boldBtn.addEventListener('click', () => {
    noteEditable.focus();
    document.execCommand('bold');
  });

  document.querySelectorAll('.color-dot').forEach(btn => {
    btn.addEventListener('click', () => {
      noteEditable.focus();
      document.execCommand('foreColor', false, btn.getAttribute('data-value'));
    });
  });

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  renderFolders();
  renderNotes();

  // Arranque automático: en cuanto se abre la app, empieza a escuchar sola.
  if (SpeechRecognition && isSecure) {
    setTimeout(() => startListening(), 400);
  }
</script>

</body>
</html>
