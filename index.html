<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memomatic</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171B2E">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #EEEEF1;
    --ink-2: #FFFFFF;
    --ink-3: #DEDEE3;
    --ink-dark: #26272C;
    --paper: #26272C;
    --amber: #D98A2B;
    --amber-dim: #D98A2B55;
    --teal: #1FAE7A;
    --red: #D14D4D;
    --muted: #85858F;
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background: linear-gradient(180deg, #F7F7F9 0%, #E9E9ED 100%);
    color: var(--paper);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 19px;
    line-height: 1.5;
    min-height: 100vh;
    padding-bottom: 48px;
  }
  header{
    padding: 28px 20px 18px;
    text-align: center;
  }
  header h1{
    font-family: "Jost", sans-serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--paper);
  }
  header p{
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 15px;
  }

  /* --- Mic stage --- */
  .stage{
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 20px 8px;
  }
  .mic-wrap{
    position: relative;
    width: 168px;
    height: 168px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 2px solid var(--amber-dim);
    opacity: 0;
  }
  .listening .ring{
    animation: pulse 1.8s ease-out infinite;
  }
  .listening .ring:nth-child(2){ animation-delay: 0.6s; }
  .listening .ring:nth-child(3){ animation-delay: 1.2s; }
  @keyframes pulse{
    0%{ transform: scale(0.75); opacity: 0.9; }
    100%{ transform: scale(1.35); opacity: 0; }
  }
  #micBtn{
    position: relative;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    border: none;
    background: var(--ink-2);
    color: var(--amber);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 2px var(--ink-3) inset;
    transition: background 0.2s, transform 0.15s;
  }
  #micBtn:active{ transform: scale(0.96); }
  .listening #micBtn{
    background: var(--amber);
    color: var(--ink-dark);
  }
  #micBtn svg{ width: 44px; height: 44px; }

  .status{
    margin-top: 18px;
    min-height: 24px;
    font-size: 16px;
    color: var(--muted);
    text-align: center;
  }
  .listening .status{ color: var(--amber); font-weight: 600; }

  .waveform{
    display: flex;
    align-items: flex-end;
    gap: 4px;
    height: 28px;
    margin-top: 10px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .listening .waveform{ opacity: 1; }
  .waveform span{
    width: 4px;
    background: var(--amber);
    border-radius: 2px;
    animation: bar 0.9s ease-in-out infinite;
  }
  .waveform span:nth-child(1){ animation-delay: 0s; }
  .waveform span:nth-child(2){ animation-delay: 0.15s; }
  .waveform span:nth-child(3){ animation-delay: 0.3s; }
  .waveform span:nth-child(4){ animation-delay: 0.45s; }
  .waveform span:nth-child(5){ animation-delay: 0.6s; }
  @keyframes bar{
    0%, 100%{ height: 6px; }
    50%{ height: 26px; }
  }

  /* --- Review editor --- */
  .editor{
    margin: 18px 20px 0;
    background: var(--ink-2);
    border-radius: 16px;
    padding: 16px;
    display: none;
  }
  .editor.show{ display: block; }
  .editor textarea{
    width: 100%;
    min-height: 110px;
    background: transparent;
    border: none;
    color: var(--paper);
    font-size: 19px;
    font-family: inherit;
    resize: vertical;
    outline: none;
  }
  .editor-actions{
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .btn{
    flex: 1;
    padding: 14px 12px;
    border-radius: 12px;
    border: none;
    font-size: 17px;
    font-weight: 600;
    font-family: inherit;
  }
  .btn-save{ background: var(--teal); color: var(--ink-dark); }
  .btn-discard{ background: transparent; color: var(--muted); border: 1px solid var(--ink-3); }

  /* --- Folders --- */
  .folders-section{
    margin: 28px 20px 0;
  }
  .folders-section h2{
    font-family: "Jost", sans-serif;
    font-size: 18px;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 12px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .folders-row{
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 4px;
    -webkit-overflow-scrolling: touch;
  }
  .folder-chip{
    flex: 0 0 auto;
    background: var(--ink-2);
    color: var(--muted);
    border: 1px solid var(--ink-3);
    border-radius: 999px;
    padding: 10px 18px;
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
  }
  .folder-chip.active{
    background: var(--amber);
    color: var(--ink-dark);
    border-color: var(--amber);
  }
  .folder-add{
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--ink-2);
    border: 1px solid var(--ink-3);
    color: var(--amber);
    font-size: 22px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  /* --- Agenda list --- */
  .agenda{
    margin: 24px 20px 0;
  }
  .note-card{
    background: var(--ink-2);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .note-text{
    flex: 1;
    font-size: 18px;
    word-break: break-word;
  }
  .note-meta{
    display: flex;
    gap: 10px;
    align-items: center;
    margin-top: 8px;
  }
  .note-time{
    color: var(--amber);
    font-size: 14px;
    font-weight: 600;
  }
  .note-folder{
    color: var(--muted);
    font-size: 13px;
    background: var(--ink-3);
    border-radius: 999px;
    padding: 2px 10px;
  }
  .del-btn{
    background: transparent;
    border: none;
    color: var(--muted);
    padding: 4px;
    font-size: 20px;
    line-height: 1;
  }
  .del-btn:active{ color: var(--red); }

  .empty{
    color: var(--muted);
    text-align: center;
    padding: 30px 20px;
    font-size: 16px;
  }

  /* --- Note edit modal --- */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: flex-end;
    z-index: 50;
  }
  .modal-overlay.show{ display: flex; }
  .modal-sheet{
    background: var(--ink-2);
    width: 100%;
    max-height: 88vh;
    border-radius: 20px 20px 0 0;
    padding: 18px 18px 20px;
    display: flex;
    flex-direction: column;
  }
  .modal-title{
    font-family: "Jost", sans-serif;
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 12px;
  }
  .toolbar{
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .tool-btn{
    background: var(--ink-3);
    color: var(--paper);
    border: none;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
  }
  .tool-btn.bold-b{ font-weight: 900; }
  .color-dot{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid var(--ink-3);
    padding: 0;
  }
  .color-dot[data-color="paper"]{ background: var(--paper); }
  .color-dot[data-color="amber"]{ background: var(--amber); }
  .color-dot[data-color="teal"]{ background: var(--teal); }
  .color-dot[data-color="red"]{ background: var(--red); }

  .note-editable{
    flex: 1;
    min-height: 140px;
    background: var(--ink);
    border-radius: 12px;
    padding: 14px;
    font-size: 18px;
    outline: none;
    overflow-y: auto;
  }
  .modal-actions{
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  .folder-select-row{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
    font-size: 15px;
    color: var(--muted);
  }
  .folder-select-row select{
    flex: 1;
    background: var(--ink);
    color: var(--paper);
    border: 1px solid var(--ink-3);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 16px;
    font-family: inherit;
  }
  .btn-delete-note{
    width: 100%;
    margin-top: 10px;
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red);
  }

  .unsupported{
    margin: 20px;
    background: var(--red);
    color: var(--ink-dark);
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 15px;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>Memomatic</h1>
</header>

<div id="unsupported" class="unsupported">
  Este navegador no admite dictado por voz. Prueba con Chrome en Android.
</div>

<div class="stage" id="stage">
  <div class="mic-wrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <button id="micBtn" aria-label="Grabar nota de voz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
  </div>
  <div class="status" id="status"></div>
  <div class="waveform">
    <span></span><span></span><span></span><span></span><span></span>
  </div>
</div>

<div class="editor" id="editor">
  <textarea id="transcriptBox" placeholder="Aquí aparecerá lo que dictes..."></textarea>
  <div class="folder-select-row">
    <label for="targetFolderSelect">Guardar en:</label>
    <select id="targetFolderSelect"></select>
  </div>
  <div class="editor-actions">
    <button class="btn btn-discard" id="discardBtn">Descartar</button>
    <button class="btn btn-save" id="saveBtn">Guardar nota</button>
  </div>
</div>

<div class="folders-section">
  <div class="folders-row" id="foldersRow"></div>
</div>

<div class="agenda">
  <div id="notesList"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-sheet">
    <h3 class="modal-title">Editar nota</h3>
    <div class="note-editable" id="noteEditable" contenteditable="true"></div>
    <div class="toolbar">
      <button class="tool-btn bold-b" id="boldBtn" type="button">N</button>
      <button class="tool-btn color-dot" data-color="paper" data-value="#26272C" type="button" aria-label="Color texto normal"></button>
      <button class="tool-btn color-dot" data-color="amber" data-value="#D98A2B" type="button" aria-label="Color ámbar"></button>
      <button class="tool-btn color-dot" data-color="teal" data-value="#1FAE7A" type="button" aria-label="Color verde"></button>
      <button class="tool-btn color-dot" data-color="red" data-value="#D14D4D" type="button" aria-label="Color rojo"></button>
      <button class="tool-btn" data-size="2" type="button">A-</button>
      <button class="tool-btn" data-size="3" type="button">A</button>
      <button class="tool-btn" data-size="5" type="button">A+</button>
    </div>
    <div class="folder-select-row">
      <label for="moveFolderSelect">Carpeta:</label>
      <select id="moveFolderSelect"></select>
    </div>
    <div class="modal-actions">
      <button class="btn btn-discard" id="modalCancel">Cancelar</button>
      <button class="btn btn-save" id="modalSave">Guardar cambios</button>
    </div>
    <button class="btn btn-delete-note" id="modalDelete">Eliminar nota</button>
  </div>
</div>

<script>
  const STORAGE_KEY = 'voicenotes_v1';
  const FOLDERS_KEY = 'voicenotes_folders_v1';
  const stage = document.getElementById('stage');
  const micBtn = document.getElementById('micBtn');
  const statusEl = document.getElementById('status');
  const editor = document.getElementById('editor');
  const transcriptBox = document.getElementById('transcriptBox');
  const saveBtn = document.getElementById('saveBtn');
  const discardBtn = document.getElementById('discardBtn');
  const notesList = document.getElementById('notesList');
  const unsupported = document.getElementById('unsupported');
  const foldersRow = document.getElementById('foldersRow');
  const modalOverlay = document.getElementById('modalOverlay');
  const noteEditable = document.getElementById('noteEditable');
  const boldBtn = document.getElementById('boldBtn');
  const modalCancel = document.getElementById('modalCancel');
  const modalSave = document.getElementById('modalSave');
  const modalDelete = document.getElementById('modalDelete');
  const targetFolderSelect = document.getElementById('targetFolderSelect');
  const moveFolderSelect = document.getElementById('moveFolderSelect');

  let activeFolderId = 'default';
  let editingNoteId = null;

  let recognition = null;
  let listening = false;
  let accumulated = '';       // texto ya confirmado de sesiones anteriores (antes de una pausa)
  let sessionFinal = '';      // texto confirmado de la sesión actual
  let userStopped = false;    // true cuando el usuario ha pulsado el botón para terminar

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  const isSecure = location.protocol === 'https:' || location.hostname === 'localhost';

  if (!SpeechRecognition) {
    unsupported.textContent = 'Este navegador no admite dictado por voz. Prueba con Chrome en Android.';
    unsupported.style.display = 'block';
    micBtn.disabled = true;
  } else if (!isSecure) {
    unsupported.textContent = 'El micrófono solo funciona si esta página se abre por https (por ejemplo, subida a GitHub Pages). Ahora mismo se ha abierto como archivo local y el reconocimiento de voz no podrá activarse.';
    unsupported.style.display = 'block';
  } else {
    recognition = new SpeechRecognition();
    recognition.lang = 'es-ES';
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      let final = '';
      let interim = '';
      for (let i = 0; i < event.results.length; i++) {
        const chunk = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          final += chunk + ' ';
        } else {
          interim += chunk;
        }
      }
      sessionFinal = final;
      statusEl.textContent = (accumulated + sessionFinal + interim).trim() || 'Escuchando...';
    };

    recognition.onerror = (event) => {
      // 'no-speech' y 'aborted' ocurren simplemente por una pausa; se reinicia solo en onend.
      if (event.error === 'no-speech' || event.error === 'aborted') return;
      let msg = 'No se ha entendido, inténtalo de nuevo';
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        msg = 'Permiso de micrófono denegado. Revisa los permisos del sitio en Chrome.';
      } else if (event.error === 'audio-capture') {
        msg = 'No se encuentra ningún micrófono disponible.';
      } else if (event.error === 'network') {
        msg = 'Sin conexión. El dictado por voz necesita internet.';
      }
      statusEl.textContent = msg;
      listening = false;
      stage.classList.remove('listening');
    };

    recognition.onend = () => {
      if (userStopped) {
        // El usuario ha pedido terminar: cerramos y mostramos la nota para revisar.
        listening = false;
        stage.classList.remove('listening');
        const text = (accumulated + sessionFinal).trim();
        accumulated = '';
        sessionFinal = '';
        if (text) {
          transcriptBox.value = text;
          populateTargetFolder();
          editor.classList.add('show');
          statusEl.textContent = 'Revisa tu nota abajo';
        } else {
          statusEl.textContent = '';
        }
      } else if (listening) {
        // Pausa detectada: guardamos lo confirmado y reiniciamos la escucha sin cerrar nada.
        accumulated += sessionFinal;
        sessionFinal = '';
        try { recognition.start(); } catch(e) {}
      }
    };
  }

  function startListening(){
    accumulated = '';
    sessionFinal = '';
    userStopped = false;
    editor.classList.remove('show');
    listening = true;
    stage.classList.add('listening');
    statusEl.textContent = 'Escuchando...';
    try { recognition.start(); } catch(e) {}
  }

  function stopListening(){
    userStopped = true;
    try { recognition.stop(); } catch(e) {}
  }

  micBtn.addEventListener('click', () => {
    if (!SpeechRecognition) return;
    if (listening) {
      stopListening();
    } else {
      startListening();
    }
  });

  discardBtn.addEventListener('click', () => {
    editor.classList.remove('show');
    transcriptBox.value = '';
    statusEl.textContent = '';
  });

  saveBtn.addEventListener('click', () => {
    const text = transcriptBox.value.trim();
    if (!text) return;
    const notes = loadNotes();
    notes.unshift({
      id: Date.now().toString(),
      html: escapeHtml(text),
      folderId: targetFolderSelect.value || 'default',
      createdAt: new Date().toISOString()
    });
    saveNotes(notes);
    renderNotes();
    editor.classList.remove('show');
    transcriptBox.value = '';
    statusEl.textContent = 'Nota guardada';
    setTimeout(() => {
      if (!listening) statusEl.textContent = '';
    }, 1800);
  });

  function loadNotes(){
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch(e) {
      return [];
    }
  }

  function saveNotes(notes){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }

  function deleteNote(id){
    const notes = loadNotes().filter(n => n.id !== id);
    saveNotes(notes);
    renderNotes();
  }

  /* --- Folders --- */
  function loadFolders(){
    try {
      const stored = JSON.parse(localStorage.getItem(FOLDERS_KEY));
      if (stored && stored.length) return stored;
    } catch(e) {}
    return [{ id: 'default', name: 'Por defecto' }];
  }

  function saveFolders(folders){
    localStorage.setItem(FOLDERS_KEY, JSON.stringify(folders));
  }

  function renderFolders(){
    const folders = loadFolders();
    const chips = [...folders];
    foldersRow.innerHTML = chips.map(f => `
      <button class="folder-chip ${f.id === activeFolderId ? 'active' : ''}" data-folder="${f.id}">${escapeHtml(f.name)}</button>
    `).join('') + '<button class="folder-add" id="addFolderBtn" aria-label="Nueva carpeta">+</button>';

    foldersRow.querySelectorAll('.folder-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        activeFolderId = chip.getAttribute('data-folder');
        renderFolders();
        renderNotes();
      });
    });
    document.getElementById('addFolderBtn').addEventListener('click', addFolder);
  }

  function addFolder(){
    const name = window.prompt('Nombre de la nueva carpeta:');
    if (!name || !name.trim()) return;
    const folders = loadFolders();
    const id = 'f' + Date.now().toString();
    folders.push({ id, name: name.trim() });
    saveFolders(folders);
    renderFolders();
  }

  function folderName(id){
    const f = loadFolders().find(x => x.id === id);
    return f ? f.name : 'Por defecto';
  }

  function fillFolderSelect(selectEl, selectedId){
    const folders = loadFolders();
    selectEl.innerHTML = folders.map(f =>
      `<option value="${f.id}" ${f.id === selectedId ? 'selected' : ''}>${escapeHtml(f.name)}</option>`
    ).join('');
  }

  function populateTargetFolder(){
    fillFolderSelect(targetFolderSelect, 'default');
  }

  function formatDate(iso){
    const d = new Date(iso);
    const today = new Date();
    const isToday = d.toDateString() === today.toDateString();
    const time = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    if (isToday) return `Hoy, ${time}`;
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' }) + `, ${time}`;
  }

  function renderNotes(){
    let notes = loadNotes().slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    notes = notes.filter(n => (n.folderId || 'default') === activeFolderId);
    if (notes.length === 0) {
      notesList.innerHTML = '<div class="empty">Todavía no hay notas aquí</div>';
      return;
    }
    notesList.innerHTML = notes.map(n => `
      <div class="note-card" data-note="${n.id}">
        <div class="note-text">
          <div>${n.html || escapeHtml(n.text || '')}</div>
          <div class="note-meta">
            <span class="note-time">${formatDate(n.createdAt)}</span>
            <span class="note-folder">${escapeHtml(folderName(n.folderId))}</span>
          </div>
        </div>
        <button class="del-btn" data-del="${n.id}" aria-label="Borrar nota">✕</button>
      </div>
    `).join('');

    notesList.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteNote(btn.getAttribute('data-del'));
      });
    });
    notesList.querySelectorAll('.note-card').forEach(card => {
      card.addEventListener('click', () => openEditor(card.getAttribute('data-note')));
    });
  }

  /* --- Note edit modal --- */
  function openEditor(id){
    const notes = loadNotes();
    const note = notes.find(n => n.id === id);
    if (!note) return;
    editingNoteId = id;
    noteEditable.innerHTML = note.html;
    fillFolderSelect(moveFolderSelect, note.folderId || 'default');
    modalOverlay.classList.add('show');
  }

  function closeEditor(){
    modalOverlay.classList.remove('show');
    editingNoteId = null;
  }

  modalCancel.addEventListener('click', closeEditor);

  modalSave.addEventListener('click', () => {
    if (!editingNoteId) return;
    const notes = loadNotes();
    const note = notes.find(n => n.id === editingNoteId);
    if (note) {
      note.html = noteEditable.innerHTML;
      note.folderId = moveFolderSelect.value || 'default';
      saveNotes(notes);
      renderNotes();
    }
    closeEditor();
  });

  modalDelete.addEventListener('click', () => {
    if (!editingNoteId) return;
    deleteNote(editingNoteId);
    closeEditor();
  });

  boldBtn.addEventListener('click', () => {
    noteEditable.focus();
    document.execCommand('bold');
  });

  document.querySelectorAll('.color-dot').forEach(btn => {
    btn.addEventListener('click', () => {
      noteEditable.focus();
      document.execCommand('foreColor', false, btn.getAttribute('data-value'));
    });
  });

  document.querySelectorAll('[data-size]').forEach(btn => {
    btn.addEventListener('click', () => {
      noteEditable.focus();
      document.execCommand('fontSize', false, btn.getAttribute('data-size'));
    });
  });

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  renderFolders();
  renderNotes();
</script>

</body>
</html>
